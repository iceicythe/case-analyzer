<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>候选复核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#213347;font:15px/1.65 system-ui,sans-serif}main{max-width:1460px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}p{margin:6px 0}.muted{color:#617184}.banner{padding:12px 16px;background:#fff5d9;border-radius:10px;margin:14px 0}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.metric{background:white;padding:12px 20px;border-radius:10px;flex:1;min-width:160px}.metric strong{display:block;font-size:24px}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #dbe3ec;border-radius:12px;padding:18px;margin-bottom:16px}aside{max-height:calc(100vh - 100px);overflow:auto;position:sticky;top:16px;align-self:start}button,select,input,textarea{font:inherit;border:1px solid #b9c7d5;border-radius:7px;padding:8px;background:#fff;color:inherit}button{cursor:pointer}button:hover,button.selected{border-color:#148b89;background:#e7f5f3}aside button{width:100%;text-align:left;margin-top:8px;overflow-wrap:anywhere}aside button small{display:block;color:#617184}#search{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#caseId{overflow-wrap:anywhere;font-size:13px;color:#617184}.badge{padding:4px 10px;background:#e7f5f3;border-radius:6px}.warn{background:#fff0df}canvas{width:100%;height:285px;display:block}.legend{font-size:13px;display:flex;gap:18px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e4eaf0;padding:7px;text-align:left;vertical-align:top}.scroll{overflow:auto}.evidence{padding:10px 0;border-top:1px solid #e4eaf0;overflow-wrap:anywhere}.evidence strong{color:#147d80}.advice{white-space:pre-wrap;overflow-wrap:anywhere}.steps{padding-left:24px}textarea{width:100%;min-height:100px;margin:10px 0}a{color:#137d83}#verdict{min-width:180px}#saveHint{font-size:13px;color:#617184}.footer{margin:20px 0;color:#617184;font-size:13px}@media(max-width:850px){main{padding:12px}.layout{grid-template-columns:1fr}aside{position:static;max-height:310px}.panel{padding:13px}canvas{height:240px}}

h3{font-size:15px;margin:12px 0 6px}summary{cursor:pointer;color:#326777}details[open]>summary{margin-bottom:10px}.banner{padding:7px 12px;margin:8px 0}.panel{padding:15px;margin-bottom:12px}.steps{margin:6px 0}.metric{padding:8px 18px}.metric strong{font-size:22px}#reviewStatus{font-size:13px}#evidenceDetails .evidence{font-size:13px}.footer{text-align:right;margin:8px 0}.model-heading{justify-content:space-between}.model-heading h2{margin-bottom:0}#reviewDetails{margin-top:10px}textarea{min-height:70px}
</style></head><body><main>
<div class="row model-heading"><h1>候选复核</h1><span id="mode" class="badge"></span></div><div class="metrics" id="metrics"></div>
<div class="layout"><aside class="panel"><input id="search" placeholder="搜索，如：第3个"><select id="filter"><option value="all">全部候选</option><option value="model_reviewed">模型已复核</option><option value="meets_numeric_rule">数值符合</option><option value="below_numeric_rule">数值未符合</option><option value="source_unverified">来源待核查</option></select><p id="listCount" class="muted"></p><div id="list"></div><details><summary>Case 概览</summary><div id="caseCounts"></div></details></aside>
<section><div class="panel" id="empty" hidden>没有匹配的候选。</div><div id="content">
<div class="panel"><div class="row model-heading"><h2 id="title"></h2><span id="assessment" class="badge"></span></div><p id="range"></p><p id="quality" class="muted"></p><canvas id="chart" aria-label="车速与候选区间"></canvas><div class="legend"><span>蓝：车速</span><span>橙：候选</span><span>绿：程序参考区间</span></div></div>
<div class="panel"><div class="row model-heading"><h2 id="reviewTitle"></h2><span id="reviewStatus" class="badge"></span></div><p class="advice" id="boundary"></p><details id="reviewDetails"><summary>疑点与检查建议</summary><ul id="uncertainty" class="steps"></ul><ol id="nextSteps" class="steps"></ol></details></div>
<div class="panel"><p id="windowSummary"></p><details id="sampleDetails"><summary>六个采样值</summary><div class="scroll"><table><thead><tr><th>秒</th><th>m/s</th><th>km/h</th><th>CSV 行号</th></tr></thead><tbody id="windowRows"></tbody></table></div></details></div>
<div class="panel"><details id="evidenceDetails"><summary>证据与原始数据</summary><p id="caseId"></p><div id="evidence"></div><details><summary>上下文数据</summary><p><a id="csvLink">车辆 CSV</a></p><div class="scroll"><table><thead><tr><th>秒</th><th>车速 m/s</th><th>辅助加速度 m/s²</th><th>CSV 行号</th></tr></thead><tbody id="contextRows"></tbody></table></div></details></details></div>
<div class="panel"><div class="row model-heading"><h2>人工意见</h2><select id="verdict"><option value="pending">未复核</option><option value="evidence_consistent">证据一致</option><option value="boundary_review">核查边界</option><option value="source_review">核查来源</option><option value="model_advice_error">模型意见有误</option></select></div><textarea id="notes" placeholder="填写意见，可附行号"></textarea><div class="row"><button id="save">保存</button><button id="export">导出意见</button><span id="saveHint"></span></div></div>
</div></section></div><p class="footer">意见保存在当前浏览器，不改人工标注。</p>
</main><script id="candidate-data" type="application/json">__CANDIDATE_DATA__</script><script>
"use strict";
const data=JSON.parse(document.getElementById("candidate-data").textContent), $=id=>document.getElementById(id);
const labels={meets_numeric_rule:"数值符合",below_numeric_rule:"数值未符合",source_unverified:"来源待核查"};
const records=data.cases.flatMap((c,index)=>c.candidates.map(r=>({...r,batch_number:index+1}))), storageKey="candidate-review:"+JSON.stringify(data.cases.map(c=>[c.case_id,c.vehicle_sha256]))+JSON.stringify(data.cases[0]?.screening_config||{});
let selected=null,opinions={};try{const saved=JSON.parse(localStorage.getItem(storageKey)||"{}");if(saved&&typeof saved==="object"&&!Array.isArray(saved))opinions=saved;}catch(_){}
const key=r=>JSON.stringify([r.case_id,r.candidate_id,r.start_time,r.end_time]);
const reviewed=records.filter(r=>r.review.adapter==="deepseek"&&r.review.status==="validated").length;
$("mode").textContent=data.real_model_called?`DeepSeek · ${reviewed} 个已复核`:"本地演示模式";
for(const [label,value] of [["Case",data.case_count],["候选",data.candidate_count],[data.real_model_called?"模型已复核":"数值符合",data.real_model_called?reviewed:data.numeric_rule_candidate_count]]){const div=document.createElement("div");div.className="metric";const strong=document.createElement("strong");strong.textContent=value;div.append(strong,document.createTextNode(label));$("metrics").append(div);}
data.cases.forEach((c,index)=>{const p=document.createElement("p");p.textContent=`第 ${index+1} 个 Case：${c.candidates.length} 个候选`;$("caseCounts").append(p);});
function fillList(id,values){$(id).replaceChildren();for(const text of values){const li=document.createElement("li");li.textContent=text;$(id).append(li);}}
function table(id,rows){$(id).replaceChildren();for(const values of rows){const tr=document.createElement("tr");for(const value of values){const td=document.createElement("td");td.textContent=value;tr.append(td);}$(id).append(tr);}}
function save(){if(!selected)return;opinions[key(selected)]={case_id:selected.case_id,candidate_id:selected.candidate_id,verdict:$("verdict").value,notes:$("notes").value,updated_at:new Date().toISOString()};try{localStorage.setItem(storageKey,JSON.stringify(opinions));$("saveHint").textContent="已保存";}catch(_){$("saveHint").textContent="无法保存，请导出意见。";}}
function draw(r){const canvas=$("chart"),width=canvas.clientWidth,height=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);const left=48,right=18,top=18,bottom=34,valid=r.points.filter(p=>Number.isFinite(p.speed_mps));if(!valid.length)return;const times=r.context_range,lo=Math.max(0,Math.min(...valid.map(p=>p.speed_mps))-0.3),hi=Math.max(...valid.map(p=>p.speed_mps))+0.3,x=t=>left+(t-times[0])/Math.max(.1,times[1]-times[0])*(width-left-right),y=v=>height-bottom-(v-lo)/Math.max(.1,hi-lo)*(height-top-bottom);
function band(a,b,color){ctx.fillStyle=color;ctx.fillRect(x(a),top,Math.max(1,x(b)-x(a)),height-top-bottom);}band(r.start_time,r.end_time,"#fff0d8");for(const interval of r.strict_reference_intervals)band(interval[0],interval[1],"#c6ece0");ctx.font="12px system-ui";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,py=y(v);ctx.strokeStyle="#e2e8ef";ctx.beginPath();ctx.moveTo(left,py);ctx.lineTo(width-right,py);ctx.stroke();ctx.fillStyle="#617184";ctx.fillText(v.toFixed(1),5,py+4);}for(let i=0;i<=4;i++){const t=times[0]+(times[1]-times[0])*i/4;ctx.fillText(t.toFixed(1)+"s",Math.min(width-38,Math.max(0,x(t)-12)),height-10);}ctx.strokeStyle="#3268d1";ctx.lineWidth=2;ctx.beginPath();let drawing=false;for(const p of r.points){if(!Number.isFinite(p.speed_mps)){drawing=false;continue;}if(drawing)ctx.lineTo(x(p.timestamp),y(p.speed_mps));else ctx.moveTo(x(p.timestamp),y(p.speed_mps));drawing=true;}ctx.stroke();}
function select(r){selected=r;$("empty").hidden=!!r;$("content").hidden=!r;if(!r)return;for(const b of $("list").children)b.classList.toggle("selected",b.dataset.key===key(r));$("title").textContent="第 "+r.batch_number+" 个 Case · "+r.candidate_id;$("assessment").textContent=labels[r.event_assessment];$("assessment").className="badge"+(r.event_assessment==="meets_numeric_rule"?"":" warn");$("caseId").textContent=r.case_id;$("range").textContent=`候选 ${r.start_time.toFixed(1)}～${r.end_time.toFixed(1)} 秒 · 参考 ${r.strict_reference_intervals.map(v=>v.map(t=>t.toFixed(1)).join("～")).join("、")||"无"}`;$("quality").textContent=(r.source_verified?"来源通过":"来源待核查")+(r.boundary_review_required?" · 核查片段边界":"")+((r.source_issues||[]).length?" · "+r.source_issues.join("；"):"");

const w=r.representative_window;$("windowSummary").textContent=`代表窗口 ${w.start_time.toFixed(1)}～${w.end_time.toFixed(1)} 秒，下降 ${w.speed_drop_mps.toFixed(3)} m/s，${w.decreasing_intervals}/5 间隔下降，回升 ${w.cumulative_recovery_mps.toFixed(3)} m/s。`;table("windowRows",r.window_points.map(p=>[p.timestamp.toFixed(1),p.speed_mps.toFixed(6),(p.speed_mps*3.6).toFixed(2),p.source_row]));table("contextRows",r.points.map(p=>[p.timestamp.toFixed(1),p.speed_mps===null?"缺失":p.speed_mps.toFixed(6),p.acceleration_mps2===null?"缺失":p.acceleration_mps2.toFixed(6),p.source_row]));
const output=r.review.output,status=r.review.status;$("reviewTitle").textContent=r.review.adapter==="deepseek"?"模型意见":r.review.adapter==="mock"?"本地演示意见":"模型意见";$("reviewStatus").textContent=status==="validated"?"输出已校验":status==="not_requested"?"未调用":"待人工核查";$("reviewStatus").className="badge"+(status==="needs_manual_review"?" warn":"");$("boundary").textContent=output?output.boundary_advice:status==="not_requested"?"尚未调用模型。":"模型调用或输出校验失败，请人工核查。";$("reviewDetails").hidden=!output;fillList("uncertainty",output?output.uncertainty:[]);fillList("nextSteps",output?output.next_steps:[]);
$("evidence").replaceChildren();for(const e of r.evidence){const div=document.createElement("div");div.className="evidence";const title=document.createElement("strong");title.textContent=e.evidence_id+" ";div.append(title,document.createTextNode(e.statement));if(e.source_rows.length){const p=document.createElement("p");p.className="muted";p.textContent="车辆 CSV 行号："+(e.source_rows.length>8?e.source_rows[0]+"～"+e.source_rows[e.source_rows.length-1]:e.source_rows.join(", "));div.append(p);}$("evidence").append(div);}$("csvLink").href=r.vehicle_csv;const opinion=opinions[key(r)]||{};$("verdict").value=opinion.verdict||"pending";$("notes").value=opinion.notes||"";$("saveHint").textContent="";draw(r);}
function render(){const search=$("search").value.trim().toLowerCase(),filter=$("filter").value;const filtered=records.filter(r=>(filter==="all"||r.event_assessment===filter||(filter==="model_reviewed"&&r.review.adapter==="deepseek"&&r.review.status==="validated"))&&(`${r.case_id} ${r.candidate_id} 第${r.batch_number}个 case${r.batch_number}`).toLowerCase().includes(search));$("listCount").textContent=`显示 ${filtered.length} / ${records.length} 个候选`;$("list").replaceChildren();for(const r of filtered){const b=document.createElement("button");b.dataset.key=key(r);b.append(document.createTextNode("第 "+r.batch_number+" 个 Case · "+`${r.candidate_id} · ${r.start_time.toFixed(1)}～${r.end_time.toFixed(1)}s`));const s=document.createElement("small");s.textContent=labels[r.event_assessment]+(r.review.adapter==="deepseek"&&r.review.status==="validated"?" · 模型已复核":"");b.append(s);b.onclick=()=>{save();select(r);};$("list").append(b);}select(filtered.find(r=>selected&&key(r)===key(selected))||filtered.find(r=>r.review.adapter==="deepseek"&&r.review.status==="validated")||filtered[0]||null);}
$("save").onclick=save;$("search").oninput=()=>{save();render();};$("filter").onchange=()=>{save();render();};$("export").onclick=()=>{save();const blob=new Blob([JSON.stringify({version:"1.0",adapter:data.adapter,policy:data.policy,opinions},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="candidate_review_opinions.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};window.addEventListener("resize",()=>{if(selected)draw(selected);});render();
</script></body></html>
